<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1db954">
    <title>Audivo - Now Playing</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }
        .widget {
            width: 100%;
            max-width: 340px;
            padding: 20px;
            text-align: center;
        }
        .artwork {
            width: 160px;
            height: 160px;
            border-radius: 16px;
            margin: 0 auto 16px;
            background: #1a1a2e;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .artwork img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .artwork-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #333;
        }
        .info { margin-bottom: 20px; }
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .artist {
            font-size: 14px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .controls button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls button:hover {
            background: rgba(255,255,255,0.1);
        }
        .controls button:active {
            background: rgba(255,255,255,0.2);
        }
        .play-btn {
            width: 56px;
            height: 56px;
            background: #1db954 !important;
            border-radius: 50%;
        }
        .play-btn:hover {
            background: #1ed760 !important;
        }
        .progress {
            width: 100%;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .progress input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1db954;
            cursor: pointer;
        }
        .progress .time {
            font-size: 11px;
            color: #666;
            min-width: 36px;
            text-align: center;
        }
        .no-song {
            color: #555;
            font-size: 14px;
        }
        .open-app {
            margin-top: 16px;
            font-size: 12px;
            color: #1db954;
            cursor: pointer;
            text-decoration: none;
        }
        .open-app:hover { text-decoration: underline; }
        .lyrics-container {
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 12px;
            text-align: center;
            scrollbar-width: none;
            mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
        }
        .lyrics-container::-webkit-scrollbar { display: none; }
        .lyrics-line {
            font-size: 13px;
            color: #555;
            padding: 3px 0;
            transition: color 0.3s, font-weight 0.3s, opacity 0.3s;
            opacity: 0.5;
        }
        .lyrics-line.active {
            color: #1db954;
            font-weight: 600;
            opacity: 1;
        }
        .lyrics-line.near {
            color: #888;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="no-song" id="no-song">No song playing</div>
        <div id="player-ui" style="display:none;">
            <div class="artwork">
                <img id="artwork" src="" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                <div class="artwork-placeholder" style="display:none;">&#9835;</div>
            </div>
            <div class="info">
                <div class="title" id="title">-</div>
                <div class="artist" id="artist">-</div>
            </div>
            <div class="controls">
                <button id="prev-btn" title="Previous">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="play-btn" class="play-btn" title="Play/Pause">
                    <svg id="play-icon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="next-btn" title="Next">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="progress">
                <span class="time" id="current-time">0:00</span>
                <input type="range" id="seek-bar" min="0" max="100" value="0">
                <span class="time" id="duration">0:00</span>
            </div>
            <div class="lyrics-container" id="lyrics-container" style="display:none;"></div>
        </div>
        <a class="open-app" href="/" id="open-app">Open Audivo</a>
    </div>

    <script>
        let channel;
        try { channel = new BroadcastChannel('audivo-widget'); } catch (e) {}
        const $ = id => document.getElementById(id);

        let playing = false;
        let lyricsData = null;
        let currentLyricIdx = -1;

        function formatTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        function updateUI(data) {
            if (!data || !data.title) {
                $('no-song').style.display = '';
                $('player-ui').style.display = 'none';
                return;
            }
            $('no-song').style.display = 'none';
            $('player-ui').style.display = '';
            $('title').textContent = data.title || '-';
            $('artist').textContent = data.artist || 'Unknown';
            if (data.thumbnail) {
                $('artwork').src = data.thumbnail;
                $('artwork').style.display = '';
                $('artwork').nextElementSibling.style.display = 'none';
            }
            playing = data.playing;
            $('play-icon').style.display = playing ? 'none' : '';
            $('pause-icon').style.display = playing ? '' : 'none';
            if (data.duration) {
                $('seek-bar').max = data.duration;
                $('duration').textContent = formatTime(data.duration);
            }
            if (data.currentTime !== undefined) {
                $('seek-bar').value = data.currentTime;
                $('current-time').textContent = formatTime(data.currentTime);
            }
            if (data.lyrics) {
                lyricsData = data.lyrics;
                renderLyrics(data.currentTime || 0);
            }
        }

        function renderLyrics(time) {
            if (!lyricsData || !lyricsData.lines || !lyricsData.lines.length) {
                $('lyrics-container').style.display = 'none';
                return;
            }
            $('lyrics-container').style.display = '';
            const lines = lyricsData.lines;
            const timedLines = lines.filter(l => l.time >= 0);
            if (!timedLines.length) {
                $('lyrics-container').innerHTML = lines.map((l, i) =>
                    '<div class="lyrics-line' + (i === 0 ? ' active' : '') + '">' + (l.text || '') + '</div>'
                ).join('');
                return;
            }
            let activeIdx = -1;
            for (let i = lines.length - 1; i >= 0; i--) {
                if (lines[i].time >= 0 && lines[i].time <= time) { activeIdx = i; break; }
            }
            if (activeIdx === currentLyricIdx) return;
            currentLyricIdx = activeIdx;
            const container = $('lyrics-container');
            container.innerHTML = lines.map((l, i) => {
                let cls = 'lyrics-line';
                if (i === activeIdx) cls += ' active';
                else if (Math.abs(i - activeIdx) === 1) cls += ' near';
                return '<div class="' + cls + '" data-idx="' + i + '">' + (l.text || '') + '</div>';
            }).join('');
            if (activeIdx >= 0) {
                const activeEl = container.querySelector('.active');
                if (activeEl) {
                    const cRect = container.getBoundingClientRect();
                    const eRect = activeEl.getBoundingClientRect();
                    const offset = eRect.top - cRect.top - cRect.height / 2 + eRect.height / 2;
                    container.scrollBy({ top: offset, behavior: 'smooth' });
                }
            }
        }

        function sendCommand(action, extra) {
            const msg = { type: 'command', action, ...extra };
            try { if (channel) channel.postMessage(msg); } catch (e) {}
            try { localStorage.setItem('audivo-widget-cmd', JSON.stringify(msg)); } catch (e) {}
        }

        if (channel) {
            channel.onmessage = (e) => {
                if (e.data && e.data.type === 'state-update') updateUI(e.data);
            };
        }

        let lastWidgetState = '';
        setInterval(() => {
            try {
                const raw = localStorage.getItem('audivo-widget-state');
                if (raw && raw !== lastWidgetState) {
                    lastWidgetState = raw;
                    updateUI(JSON.parse(raw));
                }
            } catch (e) {}
        }, 500);

        window.addEventListener('storage', (e) => {
            if (e.key === 'audivo-widget-state' && e.newValue) {
                try { updateUI(JSON.parse(e.newValue)); } catch (err) {}
            }
        });

        $('play-btn').addEventListener('click', () => sendCommand(playing ? 'pause' : 'play'));
        $('prev-btn').addEventListener('click', () => sendCommand('prev'));
        $('next-btn').addEventListener('click', () => sendCommand('next'));
        $('seek-bar').addEventListener('input', (e) => sendCommand('seek', { time: parseFloat(e.target.value) }));
        $('open-app').addEventListener('click', (e) => {
            e.preventDefault();
            try { window.location.href = '/'; } catch (err) { window.open('/', '_blank'); }
        });

        try { if (channel) channel.postMessage({ type: 'request-state' }); } catch (e) {}
    </script>
</body>
</html>
